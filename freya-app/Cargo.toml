[package]
name = "audioslim"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "audioslim"
path = "src/main.rs"

[dependencies]
freya = "0.3"
dioxus = { version = "0.6", features = [] }
tokio = { version = "1", features = ["full"] }
rfd = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
